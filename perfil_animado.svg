<svg width="840" height="460" viewBox="0 0 840 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente de fundo escuro e sofisticado (estilo GitHub Primer / Vercel) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Linha sutil de acabamento superior -->
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0" />
      <stop offset="25%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#3fb950" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0" />
    </linearGradient>

    <!-- Fundo dos cartões de métricas -->
    <linearGradient id="metricCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b212c" />
      <stop offset="100%" stop-color="#131821" />
    </linearGradient>
  </defs>

  <style>
    * {
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }

    .font-mono {
      font-family: "Cascadia Code", Consolas, "SF Mono", Menlo, Monaco, "Liberation Mono", monospace;
    }

    /* Pulsação elegante do indicador de sincronização */
    @keyframes pulseGlow {
      0% { r: 4.5; opacity: 1; }
      50% { r: 7; opacity: 0.3; }
      100% { r: 4.5; opacity: 1; }
    }
    .pulse-ring {
      animation: pulseGlow 2.5s infinite ease-in-out;
      transform-origin: 678px 57px;
    }

    /* Estilos tipográficos profissionais */
    .hero-name {
      font-weight: 700;
      font-size: 24px;
      fill: #f0f6fc;
      letter-spacing: -0.5px;
    }
    .hero-role {
      font-weight: 400;
      font-size: 13.5px;
      fill: #8b949e;
    }
    .section-label {
      font-weight: 600;
      font-size: 11px;
      fill: #58a6ff;
      letter-spacing: 0.8px;
    }
    .body-desc {
      font-weight: 400;
      font-size: 13px;
      fill: #c9d1d9;
      line-height: 1.5;
    }
    .card-title {
      font-weight: 500;
      font-size: 11.5px;
      fill: #8b949e;
    }
    .card-val {
      font-weight: 700;
      font-size: 24px;
      fill: #ffffff;
    }
    .footer-desc {
      font-weight: 400;
      font-size: 11.5px;
      fill: #6e7681;
    }
  </style>

  <!-- Moldura e Fundo Principal -->
  <rect x="1" y="1" width="838" height="458" rx="14" fill="url(#bgGradient)" stroke="#30363d" stroke-width="1.2" />

  <!-- Friso Luminoso Superior -->
  <line x1="20" y1="2" x2="820" y2="2" stroke="url(#topHighlight)" stroke-width="2" stroke-linecap="round" />

  <!-- ==================== CABEÇALHO / HEADER ==================== -->
  <g transform="translate(36, 42)">
    <!-- Nome & Título Profissional -->
    <text x="0" y="18" class="font-sans hero-name">Caio Castilho</text>
    <text x="0" y="38" class="font-sans hero-role">
      Engenheiro de Software &amp; Desenvolvedor Frontend / Fullstack
    </text>

    <!-- Badge de Status Ativo / Telemetria -->
    <g transform="translate(638, 0)">
      <rect x="0" y="0" width="130" height="28" rx="14" fill="#1b2438" stroke="#238636" stroke-width="1" />
      <circle cx="16" cy="14" r="4.5" fill="#3fb950" />
      <circle cx="16" cy="14" r="4.5" fill="#3fb950" class="pulse-ring" />
      <text x="28" y="18" class="font-sans" fill="#3fb950" font-size="11" font-weight="600" letter-spacing="0.5">
        LIVE STATS
      </text>
    </g>
  </g>

  <!-- Linha Divisória Elegante -->
  <line x1="36" y1="98" x2="804" y2="98" stroke="#21262d" stroke-width="1" />

  <!-- ==================== SEÇÃO 1: SOBRE O PERFIL ==================== -->
  <g transform="translate(36, 120)">
    <text x="0" y="0" class="font-sans section-label">VISÃO GERAL</text>
    <text x="0" y="22" class="font-sans body-desc">
      Desenvolvimento de soluções web modernas, com foco em alta performance, interfaces fluidas
    </text>
    <text x="0" y="42" class="font-sans body-desc">
      e arquiteturas escaláveis. Experiência unindo excelência em engenharia de software e design limpo.
    </text>
  </g>

  <!-- ==================== SEÇÃO 2: STACK PRINCIPAL ==================== -->
  <g transform="translate(36, 192)">
    <text x="0" y="0" class="font-sans section-label">TECNOLOGIAS PRINCIPAIS</text>

    <!-- Badges de Tecnologias com visual limpo e moderno -->
    <g transform="translate(0, 14)">
      <!-- TypeScript -->
      <g transform="translate(0, 0)">
        <rect width="102" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#3178c6" />
        <text x="22" y="17" class="font-mono" fill="#c9d1d9" font-size="11" font-weight="500">TypeScript</text>
      </g>

      <!-- React -->
      <g transform="translate(112, 0)">
        <rect width="80" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#00d8ff" />
        <text x="22" y="17" class="font-mono" fill="#c9d1d9" font-size="11" font-weight="500">React</text>
      </g>

      <!-- Next.js -->
      <g transform="translate(202, 0)">
        <rect width="84" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#ffffff" />
        <text x="22" y="17" class="font-mono" fill="#c9d1d9" font-size="11" font-weight="500">Next.js</text>
      </g>

      <!-- Python -->
      <g transform="translate(296, 0)">
        <rect width="86" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#ffd43b" />
        <text x="22" y="17" class="font-mono" fill="#c9d1d9" font-size="11" font-weight="500">Python</text>
      </g>

      <!-- Node.js -->
      <g transform="translate(392, 0)">
        <rect width="90" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#68a063" />
        <text x="22" y="17" class="font-mono" fill="#c9d1d9" font-size="11" font-weight="500">Node.js</text>
      </g>

      <!-- TailwindCSS -->
      <g transform="translate(492, 0)">
        <rect width="108" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#38bdf8" />
        <text x="22" y="17" class="font-mono" fill="#c9d1d9" font-size="11" font-weight="500">TailwindCSS</text>
      </g>

      <!-- Git & CI/CD -->
      <g transform="translate(610, 0)">
        <rect width="105" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <circle cx="12" cy="13" r="3.5" fill="#f05032" />
        <text x="22" y="17" class="font-mono" fill="#c9d1d9" font-size="11" font-weight="500">Git &amp; CI/CD</text>
      </g>
    </g>
  </g>

  <!-- ==================== SEÇÃO 3: MÉTRICAS EM TEMPO REAL ==================== -->
  <g transform="translate(36, 262)">
    <text x="0" y="0" class="font-sans section-label">ATIVIDADE NO GITHUB</text>

    <!-- Grid com 4 Cards Profissionais -->
    <g transform="translate(0, 14)">

      <!-- Card 1: Total Commits -->
      <g transform="translate(0, 0)">
        <rect width="180" height="88" rx="8" fill="url(#metricCardBg)" stroke="#30363d" stroke-width="1" />
        <!-- Ícone Commit -->
        <path d="M 22 26 A 5 5 0 0 1 32 26 A 5 5 0 0 1 22 26 M 14 26 L 22 26 M 32 26 L 40 26" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" fill="none" />
        <text x="18" y="52" class="font-sans card-title">Total de Commits</text>
        <text x="18" y="78" class="font-mono card-val" id="total-commits">4</text>
      </g>

      <!-- Card 2: Stars -->
      <g transform="translate(196, 0)">
        <rect width="180" height="88" rx="8" fill="url(#metricCardBg)" stroke="#30363d" stroke-width="1" />
        <!-- Ícone Estrela -->
        <path d="M 27 18 L 29.5 23.5 L 35.5 24.3 L 31.2 28.5 L 32.2 34.5 L 27 31.6 L 21.8 34.5 L 22.8 28.5 L 18.5 24.3 L 24.5 23.5 Z" fill="#e3b341" />
        <text x="18" y="52" class="font-sans card-title">Estrelas Recebidas</text>
        <text x="18" y="78" class="font-mono card-val" id="total-stars">0</text>
      </g>

      <!-- Card 3: Seguidores -->
      <g transform="translate(392, 0)">
        <rect width="180" height="88" rx="8" fill="url(#metricCardBg)" stroke="#30363d" stroke-width="1" />
        <!-- Ícone Usuários -->
        <circle cx="27" cy="22" r="4.5" fill="#3fb950" />
        <path d="M 18 34 C 18 29.5 22.5 29.5 27 29.5 C 31.5 29.5 36 29.5 36 34" stroke="#3fb950" stroke-width="2" fill="none" stroke-linecap="round" />
        <text x="18" y="52" class="font-sans card-title">Seguidores</text>
        <text x="18" y="78" class="font-mono card-val" id="total-followers">2</text>
      </g>

      <!-- Card 4: Repositórios -->
      <g transform="translate(588, 0)">
        <rect width="180" height="88" rx="8" fill="url(#metricCardBg)" stroke="#30363d" stroke-width="1" />
        <!-- Ícone Repositório -->
        <path d="M 20 20 L 26 20 L 29 23 L 36 23 A 2 2 0 0 1 38 25 L 38 32 A 2 2 0 0 1 36 34 L 20 34 A 2 2 0 0 1 18 32 L 18 22 A 2 2 0 0 1 20 20 Z" stroke="#bc8cff" stroke-width="1.8" fill="none" stroke-linejoin="round" />
        <text x="18" y="52" class="font-sans card-title">Repositórios Públicos</text>
        <text x="18" y="78" class="font-mono card-val" id="public-repos">1</text>
      </g>
    </g>
  </g>

  <!-- ==================== RODAPÉ / STATUS ==================== -->
  <line x1="36" y1="400" x2="804" y2="400" stroke="#21262d" stroke-width="1" />

  <g transform="translate(36, 426)">
    <!-- Automação -->
    <text x="0" y="0" class="font-sans footer-desc">
      <tspan fill="#3fb950">●</tspan> GitHub Actions Runner: <tspan fill="#c9d1d9">ativo</tspan> • Atualizado diariamente
    </text>

    <!-- Horário de sincronização -->
    <text x="768" y="0" text-anchor="end" class="font-sans footer-desc">
      Última telemetria: <tspan fill="#f0f6fc" font-weight="600">23/09/2026 22:57 BRT</tspan>
    </text>
  </g>
</svg>
